<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lấy Link Xác Thực Shopee</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f6f6f6; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .container { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 450px; box-sizing: border-box; }
        h2 { color: #ee4d2d; text-align: center; margin-top: 0; font-size: 22px; margin-bottom: 20px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; color: #333; font-size: 15px; }
        .input-group { position: relative; margin-bottom: 20px; display: flex; align-items: center; }
        input[type="text"] { width: 100%; padding: 14px; border: 1.5px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: border 0.3s; -webkit-appearance: none; }
        input[type="text"]:focus { border-color: #ee4d2d; outline: none; }
        button { width: 100%; padding: 14px; background-color: #ee4d2d; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; -webkit-appearance: none; }
        button:active { background-color: #d73c1f; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .result-box { margin-top: 25px; padding: 15px; border-radius: 8px; background-color: #fafafa; border: 1px solid #e6e6e6; display: none; box-sizing: border-box; }
        .status-success { border-left: 5px solid #2ecc71; }
        .status-error { border-left: 5px solid #e74c3c; }
        .status-loading { border-left: 5px solid #3498db; text-align: center; color: #666; font-weight: 500; }
        .data-item { margin-bottom: 12px; font-size: 15px; word-break: break-all; color: #444; }
        .data-label { font-weight: bold; color: #666; }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .verify-btn { flex: 2; display: block; text-align: center; padding: 12px; background-color: #2ecc71; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; box-sizing: border-box; -webkit-appearance: none; }
        .verify-btn:active { background-color: #27ae60; }
        .copy-btn { flex: 1; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; -webkit-appearance: none; }
        .copy-btn:active { background-color: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h2>Shopee Link Fetcher</h2>
    
    <label for="hideInput">Nhập tên hoặc địa chỉ Email:</label>
    <div class="input-group">
        <input type="text" id="hideInput" placeholder="Ví dụ: thrombo.jive_6i hoặc thrombo.jive_6i@icloud.com" inputmode="email">
    </div>
    
    <button id="fetchBtn" onclick="fetchVerificationLink()">Lấy Link Xác Thực</button>
    
    <div id="loadingBox" class="result-box status-loading">Đang kết nối hộp thư và quét dữ liệu, vui lòng đợi...</div>
    
    <div id="resultBox" class="result-box">
        <!-- Kết quả hiển thị tự động tại đây -->
    </div>
</div>

<script>
    // URL Web App Google Apps Script mới của bạn
    const webAppUrl = "https://google.com";

    async function fetchVerificationLink() {
        let inputVal = document.getElementById("hideInput").value.trim();
        const fetchBtn = document.getElementById("fetchBtn");
        const loadingBox = document.getElementById("loadingBox");
        const resultBox = document.getElementById("resultBox");
        
        if (!inputVal) {
            alert("Vui lòng nhập tên địa chỉ email của bạn!");
            return;
        }
        
        // Tự động cắt bỏ phần @icloud.com nếu người dùng nhập vào
        if (inputVal.toLowerCase().endsWith("@icloud.com")) {
            inputVal = inputVal.substring(0, inputVal.toLowerCase().lastIndexOf("@icloud.com"));
        }
        
        fetchBtn.disabled = true;
        loadingBox.style.display = "block";
        resultBox.style.display = "none";
        resultBox.className = "result-box";
        
        try {
            const response = await fetch(`${webAppUrl}?hide=${encodeURIComponent(inputVal)}`);
            const data = await response.json();
            
            loadingBox.style.display = "none";
            fetchBtn.disabled = false;
            resultBox.style.display = "block";
            
            if (data.status === "success") {
                resultBox.classList.add("status-success");
                
                let displayTime = data.thoi_gian_nhan_thu;
                if(data.thoi_gian_nhan_thu.indexOf('T') !== -1) {
                    displayTime = new Date(data.thoi_gian_nhan_thu).toLocaleString('vi-VN');
                }
                
                resultBox.innerHTML = `
                    <div class="data-item"><span class="data-label">Email quét:</span> ${data.hide_email_tin}</div>
                    <div class="data-item"><span class="data-label">Mã OTP:</span> <span style="color:#ee4d2d; font-weight:bold; font-size:18px;">${data.otp}</span></div>
                    <div class="data-item"><span class="data-label">Thời gian nhận thư:</span> <span style="color:#d35400; font-weight:bold;">${displayTime}</span></div>
                    <div class="data-item"><span class="data-label">Đường dẫn xác thực:</span></div>
                    <div style="font-size:12px; color:#666; margin-bottom:10px; max-height:60px; overflow-y:auto; background:#eee; padding:8px; border-radius:6px; word-break:break-all;">${data.link_xac_thuc_tai_day}</div>
                    
                    <div class="action-buttons">
                        <a href="${data.link_xac_thuc_tai_day}" target="_blank" class="verify-btn">MỞ LINK</a>
                        <button class="copy-btn" onclick="copyToClipboard('${data.link_xac_thuc_tai_day}')">COPY LINK</button>
                    </div>
                `;
            } else {
                resultBox.classList.add("status-error");
                resultBox.innerHTML = `
                    <div class="data-item" style="color:#e74c3c; font-weight:bold; text-align:center; margin-bottom:0;">${data.message}</div>
                `;
            }
            
        } catch (error) {
            loadingBox.style.display = "none";
            fetchBtn.disabled = false;
            resultBox.style.display = "block";
            resultBox.classList.add("status-error");
            resultBox.innerHTML = `
                <div class="data-item" style="color:#e74c3c; font-weight:bold; text-align:center; margin-bottom:0;">
                    Lỗi kết nối! Kiểm tra lại cấu hình quyền 'Anyone' của Google Web App.
                </div>
            `;
        }
    }

    function copyToClipboard(text) {
        const tempInput = document.createElement("input");
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        tempInput.setSelectionRange(0, 99999);
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        alert("Đã copy link xác thực thành công!");
    }
</script>

</body>
</html>
