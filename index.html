<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lấy Link Xác Thực Shopee</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 95vh; 
        }
        .container { 
            background: white; 
            padding: 30px 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.06), 0 1px 8px rgba(0,0,0,0.04); 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box; 
            transition: all 0.3s ease;
        }
        .container:hover {
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        h2 { 
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center; 
            margin-top: 0; 
            font-size: 24px; 
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 25px; 
        }
        label { 
            font-weight: 600; 
            display: block; 
            margin-bottom: 10px; 
            color: #4a5568; 
            font-size: 14px; 
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .input-group { 
            position: relative; 
            margin-bottom: 22px; 
            display: flex; 
            align-items: center; 
        }
        .input-icon {
            position: absolute;
            left: 14px;
            color: #a0aec0;
            font-size: 18px;
            pointer-events: none;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 15px 15px 15px 42px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 16px; 
            color: #2d3748;
            background-color: #f7fafc;
            transition: all 0.3s ease; 
            -webkit-appearance: none; 
        }
        input[type="text"]:focus { 
            border-color: #ff4b2b; 
            background-color: white;
            box-shadow: 0 0 0 4px rgba(255, 75, 43, 0.15);
            outline: none; 
        }
        button { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
            transition: all 0.3s ease; 
            -webkit-appearance: none; 
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
        }
        button:active { 
            transform: translateY(1px);
            background: linear-gradient(to right, #e63956, #e64327); 
        }
        button:disabled { 
            background: #cbd5e0; 
            box-shadow: none;
            cursor: not-allowed; 
            transform: none;
        }
        .result-box { 
            margin-top: 25px; 
            padding: 18px; 
            border-radius: 12px; 
            background-color: #fff; 
            border: 1px solid #e2e8f0; 
            display: none; 
            box-sizing: border-box; 
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .status-success { border: 2px solid #2ecc71; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.15); }
        .status-error { border: 2px solid #e74c3c; box-shadow: 0 4px 12px rgba(231, 76, 60, 0.15); }
        .status-loading { border: 2px solid #3498db; box-shadow: 0 4px 12px rgba(52, 152, 219, 0.15); text-align: center; color: #4a5568; font-weight: 600; background: #f7fafc; }
        .data-item { margin-bottom: 14px; font-size: 15px; word-break: break-all; color: #4a5568; display: flex; flex-direction: column; gap: 4px; }
        .data-label { font-weight: 700; color: #718096; font-size: 13px; text-transform: uppercase; }
        .data-value-highlight { color: #ee4d2d; font-weight: 800; font-size: 22px; background: #fff5f5; padding: 4px 10px; border-radius: 6px; display: inline-block; width: fit-content; border: 1px dashed #feb2b2; }
        
        .action-buttons { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
        .verify-btn { flex: 2; display: flex; align-items: center; justify-content: center; padding: 14px; background: linear-gradient(to right, #11998e, #38ef7d); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(56, 239, 125, 0.3); transition: all 0.2s ease; box-sizing: border-box; -webkit-appearance: none; min-width: 120px; }
        .verify-btn:hover { box-shadow: 0 6px 15px rgba(56, 239, 125, 0.4); transform: translateY(-1px); }
        .copy-btn { flex: 1; padding: 14px; background: linear-gradient(to right, #2193b0, #6dd5ed); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(109, 213, 237, 0.3); transition: all 0.2s ease; -webkit-appearance: none; min-width: 100px; }
        .copy-btn:hover { box-shadow: 0 6px 15px rgba(109, 213, 237, 0.4); transform: translateY(-1px); }
        .copy-otp-btn { flex: 1; padding: 14px; background: linear-gradient(to right, #f857a6, #ff5858); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 88, 88, 0.3); transition: all 0.2s ease; -webkit-appearance: none; min-width: 100px; }
        .copy-otp-btn:hover { box-shadow: 0 6px 15px rgba(255, 88, 88, 0.4); transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="container">
    <h2>Shopee Link Fetcher</h2>
    
    <label for="hideInput">Nhập tên hoặc địa chỉ Email:</label>
    <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="text" id="hideInput" placeholder="Ví dụ: his-95.morsel hoặc his-95.morsel@" inputmode="email">
    </div>
    
    <button id="fetchBtn" onclick="fetchVerificationLink()">Lấy Link Xác Thực / OTP</button>
    
    <div id="loadingBox" class="result-box status-loading">Đang kết nối hộp thư và quét dữ liệu, vui lòng đợi...</div>
    
    <div id="resultBox" class="result-box">
        <!-- Kết quả hiển thị tự động tại đây -->
    </div>
</div>

<script>
    // ĐỒNG BỘ ĐƯỜNG LINK: Đã điền chính xác URL Web App xử lý dữ liệu JSON thô mới nhất của bạn
    const webAppUrl = "https://google.com";

    async function fetchVerificationLink() {
        let inputVal = document.getElementById("hideInput").value.trim();
        const fetchBtn = document.getElementById("fetchBtn");
        const loadingBox = document.getElementById("loadingBox");
        const resultBox = document.getElementById("resultBox");
        
        if (!inputVal) {
            alert("Vui lòng nhập tên địa chỉ email của bạn!");
            return;
        }
        
        if (inputVal.toLowerCase().endsWith("@icloud.com")) {
            inputVal = inputVal.substring(0, inputVal.toLowerCase().lastIndexOf("@icloud.com"));
        }
        
        fetchBtn.disabled = true;
        loadingBox.style.display = "block";
        resultBox.style.display = "none";
        resultBox.className = "result-box";
        
        try {
            const response = await fetch(`${webAppUrl}?hide=${encodeURIComponent(inputVal)}`);
            const data = await response.json();
            
            loadingBox.style.display = "none";
            fetchBtn.disabled = false;
            resultBox.style.display = "block";
            
            if (data.status === "success") {
                resultBox.classList.add("status-success");
                
                let displayTime = data.thoi_gian_nhan_thu;
                if(data.thoi_gian_nhan_thu && data.thoi_gian_nhan_thu.indexOf('T') !== -1) {
                    displayTime = new Date(data.thoi_gian_nhan_thu).toLocaleString('vi-VN');
                }
                
                let actionButtonsHtml = '';
                
                if (data.link_xac_thuc_tai_day && data.link_xac_thuc_tai_day !== "Không có") {
                    actionButtonsHtml += `
                        <a href="${data.link_xac_thuc_tai_day}" target="_blank" class="verify-btn">MỞ LINK</a>
                        <button class="copy-btn" onclick="copyToClipboard('${data.link_xac_thuc_tai_day}', 'Đã copy link xác thực thành công!')">COPY LINK</button>
                    `;
                }
                
                if (data.otp && data.otp !== "Không có") {
                    actionButtonsHtml += `
                        <button class="copy-otp-btn" onclick="copyToClipboard('${data.otp}', 'Đã copy mã OTP ${data.otp} thành công!')">COPY OTP</button>
                    `;
                }
                
                resultBox.innerHTML = `
                    <div class="data-item"><span class="data-label">Email quét</span><span style="color:#2d3748; font-weight:600;">${data.hide_email_tin}</span></div>
                    <div class="data-item"><span class="data-label">Mã OTP</span><div><span class="data-value-highlight">${data.otp}</span></div></div>
